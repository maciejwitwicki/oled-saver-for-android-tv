plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization) // for fragments navigation routes
    alias(libs.plugins.protobuf)
}

def nav_version = "2.8.9"

// Optional operating-hours override for debug builds, e.g. in local.properties:
//   oledsaver.operatingHours=now          -> window always contains the current time
//   oledsaver.operatingHours=14:00-18:30  -> explicit window
// Applied at runtime only when the debug build runs on an emulator (see OperatingHours.kt).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def operatingHoursOverride = project.findProperty('oledsaver.operatingHours') ?:
        localProps.getProperty('oledsaver.operatingHours', '')

android {
    compileSdk = 34

    buildFeatures {
        buildConfig = true
    }
    buildToolsVersion '35.0.0'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    defaultConfig {
        applicationId "com.mwi.oledsaver"
        minSdkVersion 31
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        debug {
            buildConfigField 'String', 'OPERATING_HOURS_OVERRIDE', "\"${operatingHoursOverride}\""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'OPERATING_HOURS_OVERRIDE', '""'
        }
    }
    namespace 'com.mwi.oledsaver'

    sourceSets {
        main {
            java {
                srcDirs += "build/generated/source/proto/main/java"
            }
            kotlin {
                srcDirs += "build/generated/source/proto/main/kotlin"
            }
            proto {
                srcDir "src/main/proto" // default value
            }
        }
    }
}

dependencies {

    // Pure Kotlin logic (operating hours, launch decision, alarm timing)
    implementation project(':core')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:${libs.versions.kotlin.get()}"
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'


    // Views/Fragments Integration
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"


    // Feature module support for Fragments
    implementation "androidx.navigation:navigation-dynamic-features-fragment:$nav_version"

    // JSON serialization library, works with the Kotlin serialization plugin.
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.fragment:fragment-ktx:1.5.6'

    // Android data store to save properties
    implementation("androidx.datastore:datastore:1.1.7")
    implementation "androidx.datastore:datastore-core:1.1.7"
    implementation "com.google.protobuf:protobuf-javalite:3.25.8"
    implementation "com.google.protobuf:protobuf-kotlin-lite:3.25.8"

    // other
    def eventbus_version = '3.3.1'
    implementation "org.greenrobot:eventbus:$eventbus_version"

    // unit tests
    testImplementation 'junit:junit:4.13.2'

    // instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.8"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
