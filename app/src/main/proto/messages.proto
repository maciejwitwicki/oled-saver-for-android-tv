syntax = "proto3";

option java_package = "com.mwi.oledsaver.proto";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message Settings {
  google.protobuf.Timestamp started = 1;
  int32 mask_index = 2;
  // Set when the user dismisses the masker; masking stays off until this instant.
  google.protobuf.Timestamp disabled_until = 3;
}
