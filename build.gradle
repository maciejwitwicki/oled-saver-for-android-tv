// Root build file. Plugins and repositories are declared per module:
//   :core  -> Kotlin/JVM, Maven Central only (see core/build.gradle)
//   :app   -> Android, Google Maven + Maven Central (see app/build.gradle)
// Plugin repositories are configured in settings.gradle (pluginManagement).
//
// Deliberately no plugins {} block here: declaring the Kotlin plugins at the root would put
// them in a parent classloader that cannot see the Android plugin loaded by :app, and
// declaring the Android plugin here would force every build (including :core-only builds in
// environments without Google Maven) to resolve it. Gradle's note that the Kotlin plugin is
// "loaded in multiple projects" is the accepted trade-off.

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
